<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventes JAZ Trading</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#1b2430; --muted:#6b7686; --line:#e4e8ef; --head:#f6f8fb;
  --accent:#2457d6; --accent-soft:#e8eefc; --paid:#12805a; --total:#eef3ff; --err:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f151d; --card:#171f2a; --ink:#e7ecf3; --muted:#92a0b3; --line:#263140; --head:#1b2532;
  --accent:#8aa9ff; --accent-soft:#1d2b4d; --paid:#4fd09b; --total:#1b2a4a; --err:#ff8b82}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:20px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650}
.status{color:var(--muted);font-size:12.5px}
.status.err{color:var(--err)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh h2{font-size:15px;margin:0;font-weight:650}
.sh .tag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.sh .rg{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
th:last-child,td:last-child{border-right:0}
thead th{background:var(--head);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
thead th small{display:block;font-weight:500;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink)}
tbody th{text-align:left;width:19%;background:var(--head);font-size:12.5px;font-weight:600;color:var(--muted);padding-left:12px}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
td.tot,th.tot{background:var(--total);font-weight:700}
td.pay{color:var(--paid);font-weight:600}
td.zero{color:var(--muted);font-weight:400}
td.prod{font-size:11.5px;line-height:1.35;color:var(--muted);text-align:center;vertical-align:top}
td.prod div{margin-bottom:2px}
th.today{box-shadow:inset 0 -2px 0 var(--accent)}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:10px 16px;color:var(--accent);font-size:13px;font-weight:600}
.det{width:100%;table-layout:auto;font-size:12.5px}
.det th,.det td{text-align:left;padding:7px 10px}
.det th{background:var(--head);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.det td.r,.det th.r{text-align:right}
.det td.id{color:var(--muted);font-size:11.5px;word-break:break-all}
.detwrap{overflow-x:auto}
.note{color:var(--muted);font-size:12px;margin:2px 2px 0}
.narrow{display:none}
@media (max-width:720px){
  .wide{display:none}.narrow{display:table}
  .narrow thead th:first-child{text-align:left;padding-left:12px}
  .narrow tbody th{width:auto;background:var(--card);text-align:left;color:var(--ink);font-weight:600;font-size:13px}
  .narrow tbody th small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;line-height:1.3;margin-top:2px}
  .narrow td{font-size:13.5px}
  .narrow tfoot th,.narrow tfoot td{background:var(--total);font-weight:700;border-bottom:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ventes JAZ Trading</h1>
    <div class="bar">
      <span id="status" class="status" role="status">Chargement…</span>
      <button id="prev" type="button">◀</button>
      <button id="today" type="button">Aujourd'hui</button>
      <button id="next" type="button">▶</button>
      <button id="refresh" type="button" class="main">Actualiser</button>
    </div>
  </header>
  <div id="weeks"></div>
  <p class="note">Montants en F CFA, repris tels quels de Chariow. Montant des ventes : prix du produit. Montant payé : « Montant net » de Chariow (prix moins réduction, avant frais). Seules les ventes payées sont comptées. Les paiements hors Chariow (crypto) ne figurent pas ici.</p>
</div>

<script>
/* Les ventes viennent de ventes.json, mis à jour toutes les 10 minutes depuis Chariow par GitHub. */
var RELAY = "ventes.json";
var HISTORY_DAYS = 90, AUTO_MS = 60000, CACHE_KEY = "jaz_ventes_cache_v3";
var DJ = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
var MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var sales = [], offset = 0, loading = false;

function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?"0":"")+n; }
function num(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function monday(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dshort(d){ return d.getDate()+" "+MOIS[d.getMonth()]; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function shortName(n){
  var rules=[[/Pack Strat/i,"Pack Stratège"],[/Langages du March/i,"Langages du Marché"],[/Formation complet/i,"Formation"],[/Indicateurs institutionnels/i,"Indicateurs"],
    [/Offre sp/i,"Offre spéciale"],[/Cr[ée]er sa propre/i,"Créer sa stratégie"],[/Pack 4 strat/i,"Pack 4 stratégies"],[/VIP Forex/i,"VIP Forex"],[/VIP DERIV/i,"VIP DERIV"],[/Plan de trading/i,"Plan de trading"]];
  for(var i=0;i<rules.length;i++) if(rules[i][0].test(n)) return rules[i][1];
  var s=n.split(/[:—–-]/)[0].trim(); return s.length>24?s.slice(0,23)+"…":s;
}

function normalize(s){ return {id:s.id, t:new Date(s.t), prix:+s.prix||0, paye:+s.paye||0, p:s.p||""}; }
function valid(s){ return s.paye>0 && !isNaN(s.t); }

function load(){
  if(loading) return; loading=true; $("refresh").disabled=true; setStatus("Actualisation…");
  var from=ymd(addDays(new Date(),-HISTORY_DAYS));
  fetch(RELAY+"?t="+Date.now(), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status===403?"accès refusé":"erreur "+r.status);
    return r.json();
  }).then(function(j){
    sales=(j.sales||[]).map(normalize).filter(valid);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({sales:(j.sales||[])})); }catch(e){}
    var n=new Date(); setStatus("Mis à jour à "+pad(n.getHours())+":"+pad(n.getMinutes()),false); render();
  }).catch(function(e){
    setStatus("Chariow injoignable pour le moment ("+(e.message||"réseau")+"). Dernières données enregistrées affichées.", true); render();
  }).then(function(){ loading=false; $("refresh").disabled=false; });
}
function setStatus(t,err){ var s=$("status"); s.textContent=t; s.className="status"+(err?" err":""); }

function bucket(mon){
  var end=addDays(mon,7), days=[], i;
  for(i=0;i<7;i++) days.push({date:addDays(mon,i), n:0, prix:0, paye:0, prods:{}});
  var tot={n:0,prix:0,paye:0}, items=[];
  sales.forEach(function(s){
    if(s.t>=mon && s.t<end){
      var k=Math.floor((new Date(s.t.getFullYear(),s.t.getMonth(),s.t.getDate())-mon)/86400000);
      if(k<0||k>6) return;
      var d=days[k]; d.n++; d.prix+=s.prix; d.paye+=s.paye; var nm=shortName(s.p); d.prods[nm]=(d.prods[nm]||0)+1;
      tot.n++; tot.prix+=s.prix; tot.paye+=s.paye; items.push(s);
    }
  });
  items.sort(function(a,b){return a.t-b.t;});
  return {days:days,tot:tot,items:items};
}
function prodHTML(p){ var k=Object.keys(p); if(!k.length) return "—"; return k.map(function(n){return "<div>"+esc(n)+(p[n]>1?" ×"+p[n]:"")+"</div>";}).join(""); }
function cell(v,cls){ return '<td class="'+(cls||"")+(v?"":" zero")+'">'+(v?num(v):"—")+'</td>'; }

function weekHTML(mon,title,tag,todayD){
  var b=bucket(mon), sun=addDays(mon,6), i, d;
  var head="<th></th>", r1="<th>Ventes</th>", r2="<th>Montant des ventes</th>", r3="<th>Montant payé</th>", r4="<th>Produits</th>";
  for(i=0;i<7;i++){ d=b.days[i];
    head+='<th'+(ymd(d.date)===todayD?' class="today"':'')+'>'+DJ[i]+'<small>'+d.date.getDate()+'</small></th>';
    r1+=cell(d.n); r2+=cell(d.prix); r3+=cell(d.paye,"pay"); r4+='<td class="prod">'+prodHTML(d.prods)+'</td>';
  }
  head+='<th class="tot">Total</th>'; r1+=cell(b.tot.n,"tot"); r2+=cell(b.tot.prix,"tot"); r3+=cell(b.tot.paye,"tot pay"); r4+='<td class="tot"></td>';
  var wide='<table class="wide"><thead><tr>'+head+'</tr></thead><tbody><tr>'+r1+'</tr><tr>'+r2+'</tr><tr>'+r3+'</tr><tr>'+r4+'</tr></tbody></table>';
  var rows="";
  for(i=0;i<7;i++){ d=b.days[i];
    rows+='<tr><th>'+DJ[i]+' '+d.date.getDate()+(d.n?'<small>'+Object.keys(d.prods).map(function(n){return esc(n)+(d.prods[n]>1?" ×"+d.prods[n]:"");}).join(", ")+'</small>':'')+'</th>'+cell(d.n)+cell(d.prix)+cell(d.paye,"pay")+'</tr>';
  }
  var narrow='<table class="narrow"><thead><tr><th>Jour</th><th>Ventes</th><th>Montant ventes</th><th>Montant payé</th></tr></thead><tbody>'+rows+'</tbody>'+
    '<tfoot><tr><th>Total</th><td>'+num(b.tot.n)+'</td><td>'+num(b.tot.prix)+'</td><td class="pay">'+num(b.tot.paye)+'</td></tr></tfoot></table>';
  var det="";
  if(b.items.length){
    det='<details><summary>Voir les '+b.items.length+' vente'+(b.items.length>1?'s':'')+' une par une</summary><div class="detwrap"><table class="det"><thead><tr><th>Date</th><th>Vente Chariow</th><th>Produit</th><th class="r">Vente</th><th class="r">Payé</th></tr></thead><tbody>'+
      b.items.map(function(s){ return '<tr><td>'+DJ[(s.t.getDay()+6)%7]+' '+s.t.getDate()+' à '+pad(s.t.getHours())+':'+pad(s.t.getMinutes())+'</td><td class="id">'+esc(s.id)+'</td><td>'+esc(shortName(s.p))+'</td><td class="r">'+num(s.prix)+'</td><td class="r">'+num(s.paye)+'</td></tr>'; }).join("")+
      '</tbody></table></div></details>';
  }
  return '<section><div class="sh"><h2>'+title+'<span class="tag">'+tag+'</span></h2><span class="rg">du lundi '+dshort(mon)+' au dimanche '+dshort(sun)+'</span></div>'+wide+narrow+det+'</section>';
}

function render(){
  var cur=addDays(monday(new Date()),offset*7), prv=addDays(cur,-7), td=ymd(new Date());
  var open={}; [].forEach.call(document.querySelectorAll("details"),function(x,i){ open[i]=x.open; });
  $("weeks").innerHTML=weekHTML(prv,"Semaine 1",offset===0?"précédente":"",td)+weekHTML(cur,"Semaine 2",offset===0?"en cours":"",td);
  [].forEach.call(document.querySelectorAll("details"),function(x,i){ if(open[i]) x.open=true; });
  $("next").disabled=offset>=0;
}

$("prev").onclick=function(){offset--;render();};
$("next").onclick=function(){if(offset<0){offset++;render();}};
$("today").onclick=function(){offset=0;render();};
$("refresh").onclick=load;
try{ var c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c&&c.sales){ sales=c.sales.map(normalize).filter(valid); } }catch(e){}
render(); load();
setInterval(function(){ if(!document.hidden) load(); }, AUTO_MS);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
</script>
</body>
</html>
